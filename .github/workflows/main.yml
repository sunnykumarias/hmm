name: Insta Worker

# Manual run + har 5 ghante me auto-restart (6h limit se pehle)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

# Purana run ho to use rok kar naya shuru karo (duplicate worker nahi banega)
concurrency:
  group: insta-worker
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 6h limit se pehle khud ruk jao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor

      - name: Install Python deps + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start Tor
        run: |
          sudo pkill -x tor || true
          sleep 2
          nohup sudo tor -f /etc/tor/torrc > /tmp/tor.log 2>&1 &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/9050) 2>/dev/null && break
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/9050) 2>/dev/null && echo "TOR OK" || echo "TOR FAIL - /tmp/tor.log dekho"

      - name: Run worker
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WORKER_ID: ${{ secrets.WORKER_ID }}
        run: |
          python insta_worker.py --worker-id "$WORKER_ID"
