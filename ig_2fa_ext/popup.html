<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IG 2FA Helper</title>
    <style>
        body { width: 300px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; margin: 0; }
        h3 { margin: 0 0 15px 0; color: #e1306c; text-align: center; font-size: 18px; }
        .status-box { padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; color: #333; font-weight: 500; }
        .btn { background: #0095f6; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background: #0085db; }
        .btn:disabled { background: #b2dffc; cursor: not-allowed; }
        .secret-box { margin-top: 15px; display: none; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 8px; border: 2px solid #e1306c; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 16px; text-align: center; background: #fff5f8; font-weight: bold; cursor: pointer; color: #e1306c; }
    </style>
</head>
<body>
    <h3>🚀 IG 2FA Helper</h3>
    <div class="status-box" id="status-text">
        Waiting for Instagram Accounts Center to load...
    </div>
    <button class="btn" id="start-btn" disabled>Auto Setup 2FA Now</button>
    
    <div class="secret-box" id="secret-container">
        <p style="margin:0;font-size:12px;color:#333;text-align:center;"><strong>✅ TOTP Secret (Click to Copy):</strong></p>
        <input type="text" id="secret-input" readonly title="Click to copy">
        <p style="margin:8px 0 0 0;font-size:11px;color:#666;text-align:center;">The setup has been automatically submitted to Instagram.</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
